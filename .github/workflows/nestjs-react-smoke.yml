name: NestJS React stack smoke

on:
  push:
    branches: ["nestjs-react-support"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve Active LTS from index.json
        id: node
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, pathlib, os
          url = "https://nodejs.org/dist/index.json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  text = response.read().decode()
          except Exception as exc:
              raise SystemExit(f"failed to fetch {url}: {exc}; refusing to guess a Node version")
          try:
              payload = json.loads(text)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"index.json is not valid JSON: {exc}; refusing to guess a Node version")
          if not isinstance(payload, list):
              raise SystemExit("index.json must be an array; refusing to guess a Node version")
          hit = next((entry for entry in payload if isinstance(entry, dict) and entry.get("lts") is not False), None)
          if hit is None or not str(hit.get("version", "")).startswith("v"):
              raise SystemExit("no Active LTS in index.json; refusing to guess a Node version")
          exact = hit["version"][1:]
          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as handle:
              handle.write(f"version={exact}\n")
          print(exact)
          PY

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Enable Corepack
        shell: bash
        run: |
          set -euo pipefail
          # Windows runners already have shim files (yarn.cmd). --force replaces
          # them so corepack@latest can install; Linux and macOS do not need it.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            npm i -g corepack@latest --force
          else
            npm i -g corepack@latest
          fi
          corepack enable
          node -p "process.versions.node"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Python test dependencies
        run: uv sync --extra test

      - name: Policy and scenario tests
        run: uv run pytest tests/test_mas_nestjs_scenarios.py tests/test_mas_nestjs_gaps.py -q --tb=short

      - name: Feature script on Bash
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git init -b main "$work"
          git -C "$work" config user.email smoke@example.com
          git -C "$work" config user.name smoke
          mkdir -p "$work/.specify/scripts/bash" "$work/.specify/templates"
          cp scripts/bash/create-new-feature.sh scripts/bash/common.sh "$work/.specify/scripts/bash/"
          printf '# spec\n' > "$work/.specify/templates/spec-template.md"
          bash "$work/.specify/scripts/bash/create-new-feature.sh" --json --short-name user-login "Add user login" > "$work/out.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["BRANCH_NAME"].endswith("user-login")' "$work/out.json"
          set +e
          bash "$work/.specify/scripts/bash/create-new-feature.sh" --short-name x "   " >/tmp/feature-fail.txt 2>&1
          code=$?
          set -e
          test "$code" -ne 0

      - name: Feature script on PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:TEMP "speckit-smoke"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Path $work | Out-Null
          git init -b main $work
          git -C $work config user.email smoke@example.com
          git -C $work config user.name smoke
          New-Item -ItemType Directory -Force -Path "$work/.specify/scripts/powershell","$work/.specify/templates" | Out-Null
          Copy-Item scripts/powershell/create-new-feature.ps1,scripts/powershell/common.ps1 "$work/.specify/scripts/powershell/"
          Set-Content -Path "$work/.specify/templates/spec-template.md" -Value "# spec"
          & "$work/.specify/scripts/powershell/create-new-feature.ps1" -Json -ShortName "user-login" "Add user login"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Init scaffold smoke
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git init -b main "$work"
          uv run specify init "$work" --integration cursor-agent --stack nestjs-react \
            --ignore-agent-tools --script sh --skip-external-skills --non-interactive --force
          # Git Bash rewrites /tmp arguments for native Windows programs.
          # The path baked into a Python script is not rewritten, so convert it.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            SMOKE_WORK="$(cygpath -w "$work")"
          else
            SMOKE_WORK="$work"
          fi
          export SMOKE_WORK
          uv run python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["SMOKE_WORK"])
          context_path = root / ".specify" / "memory" / "stack-context.md"
          if not context_path.is_file():
              raise SystemExit(
                  f"specify init did not write {context_path}; "
                  "MAS memory is missing at the path passed to init"
              )
          context = context_path.read_text(encoding="utf-8")
          for needle in ("@scarf/scarf", "start:e2e", "OPENAPI_GENERATE", "@modelcontextprotocol/client", "shadcn add", "console.warn", "supertest"):
              if needle not in context:
                  raise SystemExit(f"missing {needle}")
          app = root / "apps/api/package.json"
          if not app.is_file():
              print("no app skeleton; skip install, build, typecheck, lint, unit, and postgres e2e")
          else:
              raise SystemExit("app skeleton present; this workflow must install and test it")
          PY
          uv run python - <<'PY'
          import json, urllib.request
          from specify_cli.mas_policy import is_prerelease, latest_stable
          def versions(name):
              with urllib.request.urlopen(f"https://registry.npmjs.org/{name}", timeout=60) as response:
                  payload = json.load(response)
              return list(payload["versions"])
          prisma = latest_stable(versions("prisma"), major=7)
          nest = latest_stable(versions("@nestjs%2Fcore"))
          assert not is_prerelease(prisma) and prisma.startswith("7.")
          assert not is_prerelease(nest)
          print("stable", prisma, nest)
          PY

      - name: Spec Kit scripts without an LLM
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git init -b main "$work"
          git -C "$work" config user.email smoke@example.com
          git -C "$work" config user.name smoke
          git -C "$work" commit --allow-empty -m base
          uv run specify init "$work" --integration cursor-agent --stack nestjs-react \
            --ignore-agent-tools --script sh --skip-external-skills --non-interactive --force
          # setup-plan resolves preset templates with the Python that is on PATH.
          # shellcheck disable=SC1091
          source .venv/bin/activate
          cd "$work"
          bash .specify/scripts/bash/create-new-feature.sh --json --short-name user-login "Add user login" > out.json
          python3 -c 'import json,subprocess; p=json.load(open("out.json")); head=subprocess.check_output(["git","symbolic-ref","HEAD"],text=True).strip(); assert head=="refs/heads/"+p["BRANCH_NAME"]'
          bash .specify/scripts/bash/ensure-feature-branch.sh
          bash .specify/scripts/bash/setup-plan.sh
          python3 -c 'import json,pathlib; p=json.load(open("out.json")); d=pathlib.Path("specs",p["BRANCH_NAME"]); d.mkdir(exist_ok=True); (d/"research.md").write_text("ok\n"); (d/"data-model.md").write_text("ok\n"); (d/"quickstart.md").write_text("ok\n"); (d/"contracts").mkdir(exist_ok=True)'
          bash .specify/scripts/bash/setup-tasks.sh
          python3 -c 'import json,pathlib; p=json.load(open("out.json")); text=pathlib.Path("specs",p["BRANCH_NAME"],"tasks.md").read_text(); assert text.strip()'
          git checkout main
          if bash .specify/scripts/bash/ensure-feature-branch.sh; then
            echo "main must be rejected" >&2
            exit 1
          fi

      - name: Spec Kit scripts on PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:TEMP "speckit-flow"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Path $work | Out-Null
          git init -b main $work
          git -C $work config user.email smoke@example.com
          git -C $work config user.name smoke
          git -C $work commit --allow-empty -m base
          uv run specify init $work --integration cursor-agent --stack nestjs-react --ignore-agent-tools --script ps --skip-external-skills --non-interactive --force
          . .\.venv\Scripts\Activate.ps1
          Set-Location $work
          $json = & .\.specify\scripts\powershell\create-new-feature.ps1 -Json -ShortName "user-login" "Add user login"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $branch = ($json | ConvertFrom-Json).BRANCH_NAME
          $head = git symbolic-ref HEAD
          if ($head -ne "refs/heads/$branch") { Write-Error "HEAD is $head"; exit 1 }
          & .\.specify\scripts\powershell\ensure-feature-branch.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.specify\scripts\powershell\setup-plan.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = Join-Path "specs" $branch
          New-Item -ItemType Directory -Force -Path (Join-Path $dir "contracts") | Out-Null
          Set-Content -Path (Join-Path $dir "research.md") -Value "ok"
          Set-Content -Path (Join-Path $dir "data-model.md") -Value "ok"
          Set-Content -Path (Join-Path $dir "quickstart.md") -Value "ok"
          & .\.specify\scripts\powershell\setup-tasks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "specs\$branch\tasks.md")) { Write-Error "tasks.md missing"; exit 1 }
          git checkout main
          & .\.specify\scripts\powershell\ensure-feature-branch.ps1
          if ($LASTEXITCODE -eq 0) { Write-Error "main must be rejected"; exit 1 }

  reference:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve Active LTS from index.json
        id: node
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, os
          url = "https://nodejs.org/dist/index.json"
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          hit = next(entry for entry in payload if isinstance(entry, dict) and entry.get("lts") is not False)
          exact = hit["version"][1:]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={exact}\n")
          print(exact)
          PY

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Enable Corepack without writing to /usr
        shell: bash
        run: |
          set -euo pipefail
          npm config set prefix "$HOME/.local"
          export PATH="$HOME/.local/bin:$PATH"
          npm i -g corepack@latest
          corepack enable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -c 'CREATE DATABASE app'
          psql -h localhost -U postgres -c 'CREATE DATABASE e2e'

      - name: Init, install the tested lockfile, and run the skeleton
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
          SEED_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
          JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
          LOGIN_THROTTLE_LIMIT: "1000"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git init -b main "$work"
          git -C "$work" config user.email smoke@example.com
          git -C "$work" config user.name smoke
          uv run specify init "$work" --integration cursor-agent --stack nestjs-react \
            --ignore-agent-tools --script sh --skip-external-skills --non-interactive --force
          cp -a "$work/.specify/reference/." "$work/"
          cd "$work"
          pnpm install --frozen-lockfile
          bash scripts/ensure-postgres.sh
          pnpm db:generate
          env -u SEED_DATABASE_URL pnpm --filter @demo/api exec prisma migrate deploy
          pnpm --filter @demo/api exec prisma migrate deploy
          pnpm db:seed
          pnpm db:seed
          pnpm verify
          pnpm build
          pnpm test:e2e:api
          pnpm test:e2e:mcp
          pnpm --filter @demo/web exec playwright install chromium
          pnpm --filter @demo/web exec node ../../scripts/ensure-playwright.mjs
          pnpm test:e2e:web
          pnpm audit --audit-level=high
          node scripts/check-prerelease.mjs
          node "$GITHUB_WORKSPACE/scripts/compile-preset-snippets.mjs" "$work"
