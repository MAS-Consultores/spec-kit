name: Security hygiene

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the PR base
        run: git fetch origin "${GITHUB_BASE_REF}"

      - name: Semgrep on the diff
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}" || true)"
          if [ -z "${base}" ]; then
            echo "no se pudo calcular merge-base" >&2
            exit 1
          fi
          pipx install semgrep==1.186.0
          # ERROR blocks (CRITICAL/HIGH). WARNING (MEDIUM) is not passed to --error.
          semgrep scan \
            --config p/php \
            --config p/owasp-top-ten \
            --config .specify/semgrep \
            --baseline-commit "${base}" \
            --severity ERROR \
            --error \
            --metrics=off

      - name: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar -xz -C /tmp
          /tmp/gitleaks detect --redact --exit-code 1 --config .specify/templates/gitleaks.toml
