name: Security hygiene

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch the PR base
        if: github.event_name == 'pull_request'
        run: git fetch origin "${GITHUB_BASE_REF}"

      - name: Semgrep on the diff
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              echo "push sin commit anterior; semgrep no compara historial" >&2
              exit 0
            fi
            base="${PUSH_BEFORE}"
          else
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}" || true)"
          fi
          if [ -z "${base}" ]; then
            echo "no se pudo calcular merge-base" >&2
            exit 1
          fi
          pipx install semgrep==1.186.0
          # ERROR blocks (CRITICAL/HIGH). WARNING (MEDIUM) is not passed to --error.
          semgrep scan \
            --config p/php \
            --config p/owasp-top-ten \
            --config .specify/semgrep \
            --baseline-commit "${base}" \
            --severity ERROR \
            --error \
            --metrics=off

      - name: gitleaks
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar -xz -C /tmp
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ -z "${PUSH_BEFORE}" ] || [ "${PUSH_BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              range="${GITHUB_SHA}"
            else
              range="${PUSH_BEFORE}..${GITHUB_SHA}"
            fi
          else
            base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")"
            range="${base}..HEAD"
          fi
          /tmp/gitleaks detect --redact --exit-code 1 --config .specify/templates/gitleaks.toml --log-opts="${range}"
