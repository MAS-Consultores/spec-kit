name: Harness weekly

# Agrega el reporte como artefacto. No hace push: runs.jsonl y harness.md se commitean en el PR del proyecto.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Aggregate telemetry
        run: |
          node scripts/harness-collect.mjs
          node scripts/harness-report.mjs --write

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-report
          path: |
            docs/metrics/harness.md
            docs/metrics/runs.jsonl
          if-no-files-found: ignore
