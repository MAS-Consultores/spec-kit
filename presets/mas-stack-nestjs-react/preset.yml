schema_version: "1.0"

preset:
  id: "mas-stack-nestjs-react"
  name: "MAS Stack - NestJS + React (API + SPA)"
  version: "0.1.0"
  description: "MAS stack preset scaffold for NestJS API backend with Prisma/PostgreSQL and React SPA frontend monorepo"
  author: "MAS Consultores"
  repository: "internal"
  license: "UNLICENSED"

requires:
  speckit_version: ">=0.8.0"

provides:
  templates:
    - type: "template"
      name: "mas-stack-nestjs-react"
      file: "templates/mas-stack-nestjs-react.md"
      description: "Stack scaffold marker for NestJS + React monorepo"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template-append.md"
      description: "NestJS + React stack constitution additions"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "NestJS + React planning rules"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "NestJS + React task rules"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "NestJS + React analyze rules"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "NestJS + React test completion gate"
      strategy: "wrap"

tags:
  - "mas"
  - "stack"
  - "nestjs"
  - "prisma"
  - "postgresql"
  - "react"
  - "typescript"
  - "api"
  - "spa"
