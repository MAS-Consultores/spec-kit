schema_version: "1.0"

preset:
  id: "mas-stack-nestjs-react"
  name: "MAS Stack - NestJS + React (API + SPA)"
  version: "0.1.0"
  description: "MAS stack preset scaffold for NestJS API backend with Prisma/PostgreSQL and React SPA frontend monorepo"
  author: "MAS Consultores"
  repository: "internal"
  license: "UNLICENSED"

requires:
  speckit_version: ">=0.8.0"

provides:
  templates:
    - type: "template"
      name: "mas-stack-nestjs-react"
      file: "templates/mas-stack-nestjs-react.md"
      description: "Stack scaffold marker for NestJS + React monorepo"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template-append.md"
      description: "NestJS + React stack constitution additions"
      strategy: "append"
    - type: "template"
      name: "approved-libraries"
      file: "templates/approved-libraries.md"
      description: "Approved libraries for formats, product UI, mail (MJML), and uploads"
    - type: "template"
      name: "common-module-tabular-import"
      file: "templates/common-modules/tabular-import.md"
      description: "Skeleton guide for the shared tabular import pipeline"
    - type: "template"
      name: "common-module-file-upload"
      file: "templates/common-modules/file-upload.md"
      description: "Skeleton guide for the shared file and image upload module"
    - type: "template"
      name: "common-module-mail"
      file: "templates/common-modules/mail.md"
      description: "Skeleton guide for the shared MJML mail module"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "NestJS + React prototype fidelity map"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "NestJS + React planning rules"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "NestJS + React task rules"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "NestJS + React analyze rules"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "NestJS + React test completion gate"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "NestJS + React quality loop"

tags:
  - "mas"
  - "stack"
  - "nestjs"
  - "prisma"
  - "postgresql"
  - "react"
  - "typescript"
  - "api"
  - "spa"
